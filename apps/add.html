<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たしざんアプリ</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css for subtle interactive animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');
        
        body {
            font-family: 'Kosugi Maru', cursive, sans-serif;
            background-color: #fefce8;
            user-select: none;
            -webkit-user-select: none;
        }

        /* プレート（お皿）の立体感 */
        .plate {
            background: radial-gradient(circle, #ffffff 60%, #e2e8f0 100%);
            border: 6px solid #cbd5e1;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        /* りんごボタンとアイコンのスタイリング */
        .apple-btn {
            transition: transform 0.1s ease, filter 0.1s ease;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.15));
        }
        .apple-btn:active {
            transform: scale(0.9);
        }

        /* 100のりんご（きんいろ/黄） */
        .apple-100 {
            background: radial-gradient(circle at 35% 35%, #fef08a, #eab308);
        }
        /* 10のりんご（みどり/青りんご） */
        .apple-10 {
            background: radial-gradient(circle at 35% 35%, #86efac, #22c55e);
        }
        /* 1のりんご（あか/赤りんご） */
        .apple-1 {
            background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444);
        }
        /* 1000のりんご（むらさき/スペシャルりんご：答えが1000以上になった時用） */
        .apple-1000 {
            background: radial-gradient(circle at 35% 35%, #d8b4fe, #9333ea);
        }

        /* りんごの葉っぱ */
        .apple-leaf {
            position: absolute;
            top: -4px;
            right: 20%;
            width: 12px;
            height: 8px;
            background-color: #15803d;
            border-radius: 10px 0 10px 0;
            transform: rotate(-15deg);
        }

        /* くき */
        .apple-stem {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 8px;
            background-color: #78350f;
            border-radius: 2px;
        }

        /* くりあがりアニメーション */
        @keyframes mergeBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }
        .animate-merge {
            animation: mergeBounce 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-3 pb-6 sm:pb-10 text-slate-800 overflow-y-auto">

    <!-- ヘッダー / 式表示エリア -->
    <header class="w-full max-w-6xl bg-white rounded-2xl p-1.5 sm:p-2.5 shadow-md border-4 border-amber-200 text-center shrink-0 flex flex-row items-center justify-between gap-2">
        
        <!-- 数式テキスト表示 -->
        <div class="flex items-center justify-center gap-2 sm:gap-3 text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-wider pl-2 sm:pl-4">
            <span id="num1-text" class="text-rose-500">0</span>
            <span class="text-slate-400">＋</span>
            <span id="num2-text" class="text-emerald-500">0</span>
            <span class="text-slate-400">＝</span>
            <span id="ans-text" class="text-amber-500">0</span>
        </div>

        <!-- 音声よみあげボタン -->
        <button id="speak-btn" onclick="speakEquation()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-3 py-1.5 sm:px-5 sm:py-2 rounded-xl shadow-md transform active:scale-95 flex items-center gap-1.5 text-sm sm:text-base md:text-lg transition shrink-0">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/>
            </svg>
            <span>こたえをきく</span>
        </button>
    </header>

    <!-- メインコンテンツ：1項目 ＋ 2項目 ＝ こたえ（横3列並び） -->
    <main class="w-full max-w-6xl flex-none landscape:flex-1 flex flex-row items-stretch justify-between gap-1 sm:gap-2 mt-2 px-0.5">
        
        <!-- お皿 1 -->
        <section class="flex-1 min-w-0 min-h-[240px] max-h-[340px] flex flex-col justify-between items-center bg-amber-100/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-amber-200">
            <!-- 皿の上領域 -->
            <div class="plate w-full flex-1 min-h-[120px] rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden">
                <!-- 数字表示用バッジ -->
                <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-rose-300 shadow-sm text-sm sm:text-base md:text-lg font-bold text-rose-500 z-10" id="plate1-count">
                    0
                </div>

                <!-- りんごが並ぶ領域 -->
                <div id="plate1-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-y-auto">
                    <!-- りんご動的追加 -->
                </div>
            </div>

            <!-- 操作ボタンエリア（下部） -->
            <div class="mt-1.5 sm:mt-2 flex flex-col items-center gap-1 sm:gap-1.5 w-full shrink-0">
                <!-- りんご追加ボタン -->
                <div class="flex justify-center gap-1 sm:gap-2 w-full">
                    <button onclick="addApple(1, 100)" class="apple-btn apple-100 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-slate-800 font-extrabold text-[11px] sm:text-xs md:text-base shadow-md border-2 border-yellow-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        100
                    </button>
                    <button onclick="addApple(1, 10)" class="apple-btn apple-10 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-emerald-950 font-extrabold text-xs sm:text-sm md:text-base shadow-md border-2 border-green-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        10
                    </button>
                    <button onclick="addApple(1, 1)" class="apple-btn apple-1 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-white font-extrabold text-sm sm:text-base md:text-lg shadow-md border-2 border-red-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        1
                    </button>
                </div>
                <!-- へらすボタン -->
                <button onclick="removeApple(1)" class="bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold px-3 py-0.5 sm:px-4 sm:py-1 rounded-full border-2 border-rose-300 text-xs sm:text-sm shadow-sm transition active:scale-95">
                    へらす
                </button>
            </div>
        </section>

        <!-- ＋記号 -->
        <div class="flex items-center justify-center text-xl sm:text-2xl md:text-3xl font-black text-amber-400 font-sans shrink-0">＋</div>

        <!-- お皿 2 -->
        <section class="flex-1 min-w-0 min-h-[240px] max-h-[340px] flex flex-col justify-between items-center bg-emerald-100/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-emerald-200">
            <!-- 皿の上領域 -->
            <div class="plate w-full flex-1 min-h-[120px] rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden">
                <!-- 数字表示用バッジ -->
                <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-emerald-300 shadow-sm text-sm sm:text-base md:text-lg font-bold text-emerald-600 z-10" id="plate2-count">
                    0
                </div>

                <!-- りんごが並ぶ領域 -->
                <div id="plate2-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-y-auto">
                    <!-- りんご動的追加 -->
                </div>
            </div>

            <!-- 操作ボタンエリア（下部） -->
            <div class="mt-1.5 sm:mt-2 flex flex-col items-center gap-1 sm:gap-1.5 w-full shrink-0">
                <!-- りんご追加ボタン -->
                <div class="flex justify-center gap-1 sm:gap-2 w-full">
                    <button onclick="addApple(2, 100)" class="apple-btn apple-100 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-slate-800 font-extrabold text-[11px] sm:text-xs md:text-base shadow-md border-2 border-yellow-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        100
                    </button>
                    <button onclick="addApple(2, 10)" class="apple-btn apple-10 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-emerald-950 font-extrabold text-xs sm:text-sm md:text-base shadow-md border-2 border-green-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        10
                    </button>
                    <button onclick="addApple(2, 1)" class="apple-btn apple-1 relative w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center text-white font-extrabold text-sm sm:text-base md:text-lg shadow-md border-2 border-red-300">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        1
                    </button>
                </div>
                <!-- へらすボタン -->
                <button onclick="removeApple(2)" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold px-3 py-0.5 sm:px-4 sm:py-1 rounded-full border-2 border-emerald-300 text-xs sm:text-sm shadow-sm transition active:scale-95">
                    へらす
                </button>
            </div>
        </section>

        <!-- ＝記号 -->
        <div class="flex items-center justify-center text-xl sm:text-2xl md:text-3xl font-black text-amber-400 font-sans shrink-0">＝</div>

        <!-- こたえエリア（お皿の枠を下に広げ、ぜんぶけすボタンの下端を2項の枠の下端と揃える） -->
        <div class="flex-1 min-w-0 min-h-[240px] max-h-[340px] flex flex-col justify-between items-center gap-1.5 sm:gap-2">
            <!-- 枠（残り高さいっぱいに広げる） -->
            <section class="w-full flex-1 min-h-[120px] flex flex-col items-center justify-center bg-amber-200/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-amber-300">
                <!-- 皿の上領域 -->
                <div class="plate w-full h-full rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden border-amber-300">
                    <!-- 数字表示用バッジ -->
                    <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-amber-400 shadow-sm text-sm sm:text-base md:text-lg font-bold text-amber-600 z-10" id="plate-ans-count">
                        0
                    </div>

                    <!-- りんごが並ぶ領域 -->
                    <div id="plate-ans-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-y-auto">
                        <!-- こたえのりんご動的追加 -->
                    </div>
                </div>
            </section>

            <!-- 枠の外（最下部）にぜんぶけすボタンを配置し、下端を揃える -->
            <div class="shrink-0 flex items-center justify-center w-full">
                <button onclick="resetAll()" class="bg-white/95 hover:bg-white text-slate-600 font-bold px-4 py-1 sm:px-6 sm:py-1.5 rounded-full border-2 border-slate-300 shadow-sm text-xs sm:text-sm md:text-base transition active:scale-95">
                    ぜんぶけす
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // お皿ごとの桁別りんごの数
        const state = {
            1: { 100: 0, 10: 0, 1: 0 },
            2: { 100: 0, 10: 0, 1: 0 }
        };

        // Web Audio API による効果音再生
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound(pitchMultiplier = 1) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 * pitchMultiplier, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600 * pitchMultiplier, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playCarrySound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(now + 0.35);
        }

        // りんごを追加する関数
        function addApple(plateId, value) {
            state[plateId][value]++;
            playPopSound(value === 100 ? 1.5 : value === 10 ? 1.2 : 1.0);
            
            // くりあがり判定
            checkCarryOver(plateId);
            
            // 画面描画更新
            renderPlate(plateId);
            updateMath();
        }

        // 最後のりんごを1つ削除する（へらす）
        function removeApple(plateId) {
            const current = state[plateId];
            if (current[1] > 0) {
                current[1]--;
            } else if (current[10] > 0) {
                current[10]--;
            } else if (current[100] > 0) {
                current[100]--;
            } else {
                return; // なにも減らせない
            }
            playPopSound(0.7);
            renderPlate(plateId);
            updateMath();
        }

        // くりあがり処理（10個集まったら上の桁へ）
        function checkCarryOver(plateId) {
            let carried = false;
            // 1のりんごが10個以上
            if (state[plateId][1] >= 10) {
                state[plateId][1] -= 10;
                state[plateId][10] += 1;
                carried = true;
            }
            // 10のりんごが10個以上
            if (state[plateId][10] >= 10) {
                state[plateId][10] -= 10;
                state[plateId][100] += 1;
                carried = true;
            }
            // 100のりんごの上限（900までに制限）
            if (state[plateId][100] > 9) {
                state[plateId][100] = 9;
            }

            if (carried) {
                playCarrySound();
            }
        }

        // お皿の描画を更新（チカチカしないように軽量アニメーションで生成）
        function renderPlate(plateId) {
            const container = document.getElementById(`plate${plateId}-apples`);
            container.innerHTML = '';

            const counts = state[plateId];

            // 100のりんご
            for (let i = 0; i < counts[100]; i++) {
                container.appendChild(createAppleElement(100));
            }
            // 10のりんご
            for (let i = 0; i < counts[10]; i++) {
                container.appendChild(createAppleElement(10));
            }
            // 1のりんご
            for (let i = 0; i < counts[1]; i++) {
                container.appendChild(createAppleElement(1));
            }

            // 数字バッジ更新
            const total = counts[100] * 100 + counts[10] * 10 + counts[1];
            document.getElementById(`plate${plateId}-count`).textContent = total;
        }

        // りんごエレメントの生成
        function createAppleElement(value) {
            const div = document.createElement('div');
            div.className = `apple-btn apple-${value} relative w-6 h-6 sm:w-7 sm:h-7 md:w-9 md:h-9 rounded-full flex items-center justify-center font-bold shadow-sm transition-transform duration-100`;
            
            if (value === 1000) {
                div.classList.add('text-white', 'text-[8px]', 'sm:text-[9px]', 'md:text-[11px]');
            } else if (value === 100) {
                div.classList.add('text-slate-800', 'text-[9px]', 'sm:text-[10px]', 'md:text-xs');
            } else if (value === 10) {
                div.classList.add('text-emerald-950', 'text-[10px]', 'sm:text-xs', 'md:text-sm');
            } else {
                div.classList.add('text-white', 'text-xs', 'sm:text-sm', 'md:text-base');
            }

            div.innerHTML = `
                <div class="apple-stem"></div>
                <div class="apple-leaf"></div>
                <span>${value}</span>
            `;
            return div;
        }

        // 計算式と回答（数字＆りんご）の更新
        function updateMath() {
            const num1 = state[1][100] * 100 + state[1][10] * 10 + state[1][1];
            const num2 = state[2][100] * 100 + state[2][10] * 10 + state[2][1];
            const ans = num1 + num2;

            // 上部の式更新
            document.getElementById('num1-text').textContent = num1;
            document.getElementById('num2-text').textContent = num2;
            document.getElementById('ans-text').textContent = ans;

            // こたえのお皿の数字バッジ更新
            document.getElementById('plate-ans-count').textContent = ans;

            // こたえのお皿のりんご描画（1000, 100, 10, 1の位に分解）
            const ansContainer = document.getElementById('plate-ans-apples');
            ansContainer.innerHTML = '';

            const c1000 = Math.floor(ans / 1000);
            const c100 = Math.floor((ans % 1000) / 100);
            const c10 = Math.floor((ans % 100) / 10);
            const c1 = ans % 10;

            for (let i = 0; i < c1000; i++) ansContainer.appendChild(createAppleElement(1000));
            for (let i = 0; i < c100; i++) ansContainer.appendChild(createAppleElement(100));
            for (let i = 0; i < c10; i++) ansContainer.appendChild(createAppleElement(10));
            for (let i = 0; i < c1; i++) ansContainer.appendChild(createAppleElement(1));
        }

        // ぜんぶクリア
        function resetAll() {
            state[1] = { 100: 0, 10: 0, 1: 0 };
            state[2] = { 100: 0, 10: 0, 1: 0 };
            renderPlate(1);
            renderPlate(2);
            updateMath();
            playPopSound(0.5);
        }

        // 音声読み上げ機能 (Web Speech API)
        function speakEquation() {
            if (!('speechSynthesis' in window)) {
                return;
            }

            // 現在の発話をキャンセル
            window.speechSynthesis.cancel();

            const num1 = state[1][100] * 100 + state[1][10] * 10 + state[1][1];
            const num2 = state[2][100] * 100 + state[2][10] * 10 + state[2][1];
            const ans = num1 + num2;

            const text = `${num1} たす ${num2} は ${ans} です。`;

            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = 0.85; 
            uttr.pitch = 1.2; 

            const btn = document.getElementById('speak-btn');
            btn.classList.add('scale-105', 'ring-4', 'ring-amber-300');
            uttr.onend = () => {
                btn.classList.remove('scale-105', 'ring-4', 'ring-amber-300');
            };

            window.speechSynthesis.speak(uttr);
        }

        // 初開時初期化
        window.onload = function() {
            renderPlate(1);
            renderPlate(2);
            updateMath();
        };
    </script>
</body>
</html>
