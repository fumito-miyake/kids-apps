
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>りんごのたしざん</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 子供向けに丸みのある読みやすいフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fffbeb;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* お皿の立体感とデザイン */
        .plate {
            background: radial-gradient(circle at 50% 45%, #ffffff 60%, #f1f5f9 85%, #e2e8f0 100%);
            box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.1), inset 0 -4px 8px rgba(0, 0, 0, 0.05);
            border: 3px solid #cbd5e1;
        }

        /* りんごのグラデーションと立体感 */
        .apple-1 {
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
            box-shadow: 0 3px 6px rgba(214, 48, 49, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
        }
        .apple-10 {
            background: radial-gradient(circle at 30% 30%, #55efc4, #00b894);
            box-shadow: 0 3px 6px rgba(0, 184, 148, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
        }
        .apple-100 {
            background: radial-gradient(circle at 30% 30%, #ffeaa7, #fdcb6e);
            box-shadow: 0 3px 6px rgba(253, 203, 110, 0.45), inset 0 -2px 4px rgba(0, 0, 0, 0.15);
        }
        .apple-1000 {
            background: radial-gradient(circle at 30% 30%, #a29bfe, #6c5ce7);
            box-shadow: 0 3px 6px rgba(108, 92, 231, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
        }

        /* りんごの葉っぱとくき */
        .apple-leaf {
            position: absolute;
            top: -3px;
            right: 22%;
            width: 11px;
            height: 7px;
            background-color: #2ecc71;
            border-radius: 10px 0 10px 0;
            transform: rotate(-20deg);
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            pointer-events: none;
        }
        .apple-stem {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 7px;
            background-color: #795548;
            border-radius: 2px;
            pointer-events: none;
        }

        /* りんごが多いときの縮小用（葉っぱとくきも比例縮小） */
        .apple-compact .apple-leaf {
            width: 8px;
            height: 5px;
            top: -2px;
        }
        .apple-compact .apple-stem {
            width: 2px;
            height: 5px;
            top: -4px;
        }

        /* くりあがりアニメーション */
        @keyframes mergeBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }
        .animate-merge {
            animation: mergeBounce 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pt-1 sm:pt-1.5 px-2 sm:px-3 pb-14 sm:pb-20 text-slate-800 overflow-y-auto">

    <!-- ヘッダー：式表示とよみあげボタン（高さを少し上に詰めてコンパクト化） -->
    <header class="w-full max-w-6xl bg-white rounded-2xl shadow-md border-2 border-amber-200 px-3 py-1 sm:px-5 sm:py-1.5 flex items-center justify-between gap-2 shrink-0">
        <!-- 式の表示 -->
        <div class="flex items-center justify-center flex-1 text-xl sm:text-3xl md:text-4xl font-extrabold tracking-wider text-slate-700 gap-1.5 sm:gap-3">
            <span id="num1-text" class="text-rose-500 min-w-[2ch] text-right">0</span>
            <span class="text-amber-400">＋</span>
            <span id="num2-text" class="text-emerald-600 min-w-[2ch] text-right">0</span>
            <span class="text-amber-400">＝</span>
            <span id="ans-text" class="text-amber-600 bg-amber-100 px-2.5 py-0.5 sm:px-4 sm:py-0.5 rounded-xl border-2 border-amber-300 min-w-[2.5ch] text-center">0</span>
        </div>

        <!-- 音声よみあげボタン -->
        <button id="speak-btn" onclick="speakEquation()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-3 py-1 sm:px-5 sm:py-1.5 rounded-xl shadow-md transform active:scale-95 flex items-center gap-1.5 text-sm sm:text-base md:text-lg transition shrink-0">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/>
            </svg>
            <span>こたえをきく</span>
        </button>
    </header>

    <!-- メインコンテンツ：1項目 ＋ 2項目 ＝ こたえ（横3列並び・高さ固定） -->
    <main class="w-full max-w-6xl flex-none flex flex-row items-stretch justify-between gap-1 sm:gap-2 mt-1.5 px-0.5">
        
        <!-- お皿 1（りんご2行分の高さで固定） -->
        <section class="flex-1 min-w-0 h-[225px] sm:h-[255px] md:h-[290px] flex flex-col justify-between items-center bg-amber-100/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-amber-200">
            <!-- 皿の上領域 -->
            <div class="plate w-full flex-1 rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden">
                <!-- 数字表示用バッジ -->
                <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-rose-300 shadow-sm text-sm sm:text-base md:text-lg font-bold text-rose-500 z-10" id="plate1-count">
                    0
                </div>

                <!-- りんごが並ぶ領域（2行固定・はみ出し防止） -->
                <div id="plate1-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-hidden">
                    <!-- りんご動的追加 -->
                </div>
            </div>

            <!-- 操作ボタンエリア（下部） -->
            <div class="mt-1.5 sm:mt-2 flex flex-col items-center gap-1 sm:gap-1.5 w-full shrink-0">
                <!-- 100, 10, 1 入力りんご -->
                <div class="flex items-center justify-center gap-1.5 sm:gap-2.5">
                    <button onclick="addApple(1, 100)" class="apple-100 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-slate-800 font-extrabold text-xs sm:text-sm transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>100</span>
                    </button>
                    <button onclick="addApple(1, 10)" class="apple-10 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-emerald-950 font-extrabold text-sm sm:text-base transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>10</span>
                    </button>
                    <button onclick="addApple(1, 1)" class="apple-1 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-white font-extrabold text-base sm:text-lg transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>1</span>
                    </button>
                </div>

                <!-- へらすボタン（濃い黄色〜オレンジ・白文字） -->
                <button onclick="removeApple(1)" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3.5 py-0.5 sm:px-5 sm:py-1 rounded-full border-2 border-amber-600 text-xs sm:text-sm shadow-sm transition active:scale-95">
                    へらす
                </button>
            </div>
        </section>

        <!-- ＋記号 -->
        <div class="flex items-center justify-center text-xl sm:text-2xl md:text-3xl font-black text-amber-400 font-sans shrink-0">＋</div>

        <!-- お皿 2（りんご2行分の高さで固定） -->
        <section class="flex-1 min-w-0 h-[225px] sm:h-[255px] md:h-[290px] flex flex-col justify-between items-center bg-emerald-100/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-emerald-200">
            <!-- 皿の上領域 -->
            <div class="plate w-full flex-1 rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden">
                <!-- 数字表示用バッジ -->
                <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-emerald-300 shadow-sm text-sm sm:text-base md:text-lg font-bold text-emerald-600 z-10" id="plate2-count">
                    0
                </div>

                <!-- りんごが並ぶ領域（2行固定・はみ出し防止） -->
                <div id="plate2-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-hidden">
                    <!-- りんご動的追加 -->
                </div>
            </div>

            <!-- 操作ボタンエリア（下部） -->
            <div class="mt-1.5 sm:mt-2 flex flex-col items-center gap-1 sm:gap-1.5 w-full shrink-0">
                <!-- 100, 10, 1 入力りんご -->
                <div class="flex items-center justify-center gap-1.5 sm:gap-2.5">
                    <button onclick="addApple(2, 100)" class="apple-100 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-slate-800 font-extrabold text-xs sm:text-sm transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>100</span>
                    </button>
                    <button onclick="addApple(2, 10)" class="apple-10 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-emerald-950 font-extrabold text-sm sm:text-base transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>10</span>
                    </button>
                    <button onclick="addApple(2, 1)" class="apple-1 relative w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-white font-extrabold text-base sm:text-lg transform active:scale-90 transition cursor-pointer">
                        <div class="apple-stem"></div>
                        <div class="apple-leaf"></div>
                        <span>1</span>
                    </button>
                </div>

                <!-- へらすボタン（濃い緑・白文字） -->
                <button onclick="removeApple(2)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3.5 py-0.5 sm:px-5 sm:py-1 rounded-full border-2 border-emerald-600 text-xs sm:text-sm shadow-sm transition active:scale-95">
                    へらす
                </button>
            </div>
        </section>

        <!-- ＝記号 -->
        <div class="flex items-center justify-center text-xl sm:text-2xl md:text-3xl font-black text-amber-400 font-sans shrink-0">＝</div>

        <!-- こたえエリア（りんご3行分の高さで固定・下端を2項と揃える） -->
        <div class="flex-1 min-w-0 h-[225px] sm:h-[255px] md:h-[290px] flex flex-col justify-between items-center gap-1.5 sm:gap-2">
            <!-- 枠（残り高さいっぱいに広げる） -->
            <section class="w-full flex-1 flex flex-col items-center justify-center bg-amber-200/60 p-1.5 sm:p-2.5 rounded-2xl border-2 border-amber-300 overflow-hidden">
                <!-- 皿の上領域 -->
                <div class="plate w-full h-full rounded-full flex flex-col justify-center items-center relative p-1.5 sm:p-2 overflow-hidden border-amber-300">
                    <!-- 数字表示用バッジ -->
                    <div class="absolute top-1 bg-white/95 px-2 py-0.5 rounded-full border border-amber-400 shadow-sm text-sm sm:text-base md:text-lg font-bold text-amber-600 z-10" id="plate-ans-count">
                        0
                    </div>

                    <!-- りんごが並ぶ領域（3行固定・はみ出し防止） -->
                    <div id="plate-ans-apples" class="w-full h-full flex flex-wrap content-center justify-center gap-0.5 sm:gap-1 p-1 pt-6 sm:pt-7 overflow-hidden">
                        <!-- こたえのりんご動的追加 -->
                    </div>
                </div>
            </section>

            <!-- 枠の外（最下部）にぜんぶけすボタンを配置し、下端を揃える -->
            <button onclick="resetAll()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1.5 sm:py-2 rounded-xl border-2 border-slate-300 shadow-sm text-xs sm:text-sm transition active:scale-95 shrink-0">
                ぜんぶけす
            </button>
        </div>

    </main>

    <script>
        // 状態管理（お皿1とお皿2のそれぞれの桁のりんご数）
        const state = {
            1: { 100: 0, 10: 0, 1: 0 },
            2: { 100: 0, 10: 0, 1: 0 }
        };

        // 効果音用 Web Audio API コンテキスト
        let audioCtx = null;

        function playPopSound(pitchMultiplier = 1.0) {
            try {
                // 読み上げ中なら効果音は鳴らさず音声干渉を防ぐ
                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    return;
                }

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(320 * pitchMultiplier, now);
                osc.frequency.exponentialRampToValueAtTime(600 * pitchMultiplier, now + 0.08);
                
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + 0.09);
            } catch (e) {
                // 音声再生エラーは無視
            }
        }

        function playCarrySound() {
            try {
                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    return;
                }

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // ド・ミ・ソ・高いド
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    
                    const startTime = now + idx * 0.05;
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    gain.gain.setValueAtTime(0.10, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(startTime);
                    osc.stop(startTime + 0.16);
                });
            } catch (e) {
                // 音声再生エラーは無視
            }
        }

        // りんごを追加する（くりあがり処理つき）
        function addApple(plateId, value) {
            // 100の位が9個以上のときはそれ以上増やさない（最大999まで）
            if (value === 100 && state[plateId][100] >= 9) {
                playPopSound(0.6);
                return;
            }

            state[plateId][value]++;
            let carried = false;

            // 1の位が10個になったら10の位へくりあがり
            if (state[plateId][1] >= 10) {
                state[plateId][1] -= 10;
                state[plateId][10]++;
                carried = true;
            }

            // 10の位が10個になったら100の位へくりあがり
            if (state[plateId][10] >= 10) {
                if (state[plateId][100] < 9) {
                    state[plateId][10] -= 10;
                    state[plateId][100]++;
                    carried = true;
                } else {
                    // 999を超える場合は10の位を9に戻す
                    state[plateId][10] = 9;
                }
            }

            if (carried) {
                playCarrySound();
            } else {
                const pitch = value === 100 ? 0.8 : (value === 10 ? 1.0 : 1.2);
                playPopSound(pitch);
            }

            renderPlate(plateId, carried);
            updateMath();
        }

        // りんごを1つ減らす（一番小さい桁から減らす）
        function removeApple(plateId) {
            const counts = state[plateId];
            if (counts[1] > 0) {
                counts[1]--;
                playPopSound(0.7);
            } else if (counts[10] > 0) {
                counts[10]--;
                playPopSound(0.7);
            } else if (counts[100] > 0) {
                counts[100]--;
                playPopSound(0.7);
            } else {
                return;
            }

            renderPlate(plateId, false);
            updateMath();
        }

        // お皿の描画を更新（収まらない個数になったらサイズを縮小）
        function renderPlate(plateId, withCarryAnim = false) {
            const container = document.getElementById(`plate${plateId}-apples`);
            container.innerHTML = '';

            const counts = state[plateId];
            const totalApples = counts[100] + counts[10] + counts[1];
            
            // 2行のお皿に収まらない個数（目安：9個以上）なら縮小モードにする
            const isCompact = totalApples >= 9;
            const isSuperCompact = totalApples >= 17;
            const sizeMode = isSuperCompact ? 'super' : (isCompact ? 'compact' : 'normal');

            // 100のりんご
            for (let i = 0; i < counts[100]; i++) {
                const el = createAppleElement(100, sizeMode);
                if (withCarryAnim && i === counts[100] - 1) el.classList.add('animate-merge');
                container.appendChild(el);
            }
            // 10のりんご
            for (let i = 0; i < counts[10]; i++) {
                const el = createAppleElement(10, sizeMode);
                if (withCarryAnim && i === counts[10] - 1) el.classList.add('animate-merge');
                container.appendChild(el);
            }
            // 1のりんご
            for (let i = 0; i < counts[1]; i++) {
                container.appendChild(createAppleElement(1, sizeMode));
            }

            // 数字バッジ更新
            const total = counts[100] * 100 + counts[10] * 10 + counts[1];
            document.getElementById(`plate${plateId}-count`).textContent = total;
        }

        // りんごエレメントの生成（sizeMode: 'normal' | 'compact' | 'super'）
        function createAppleElement(value, sizeMode = 'normal') {
            const div = document.createElement('div');
            
            let sizeClasses = 'w-6 h-6 sm:w-7 sm:h-7 md:w-9 md:h-9';
            if (sizeMode === 'compact') {
                sizeClasses = 'apple-compact w-5 h-5 sm:w-5 sm:h-5 md:w-6 md:h-6';
            } else if (sizeMode === 'super') {
                sizeClasses = 'apple-compact w-4 h-4 sm:w-4 sm:h-4 md:w-5 md:h-5';
            }

            div.className = `apple-btn apple-${value} relative ${sizeClasses} rounded-full flex items-center justify-center font-bold shadow-sm transition-transform duration-100 shrink-0`;
            
            if (sizeMode === 'super') {
                div.classList.add(value === 100 ? 'text-slate-900' : 'text-white', 'text-[7px]', 'sm:text-[8px]');
            } else if (sizeMode === 'compact') {
                if (value === 1000) div.classList.add('text-white', 'text-[7px]', 'sm:text-[8px]');
                else if (value === 100) div.classList.add('text-slate-800', 'text-[8px]', 'sm:text-[9px]');
                else if (value === 10) div.classList.add('text-emerald-950', 'text-[9px]', 'sm:text-[10px]');
                else div.classList.add('text-white', 'text-[10px]', 'sm:text-xs');
            } else {
                if (value === 1000) {
                    div.classList.add('text-white', 'text-[8px]', 'sm:text-[9px]', 'md:text-[11px]');
                } else if (value === 100) {
                    div.classList.add('text-slate-800', 'text-[9px]', 'sm:text-[10px]', 'md:text-xs');
                } else if (value === 10) {
                    div.classList.add('text-emerald-950', 'text-[10px]', 'sm:text-xs', 'md:text-sm');
                } else {
                    div.classList.add('text-white', 'text-xs', 'sm:text-sm', 'md:text-base');
                }
            }

            div.innerHTML = `
                <div class="apple-stem"></div>
                <div class="apple-leaf"></div>
                <span>${value}</span>
            `;
            return div;
        }

        // 計算式と回答（数字＆りんご）の更新
        function updateMath() {
            const num1 = state[1][100] * 100 + state[1][10] * 10 + state[1][1];
            const num2 = state[2][100] * 100 + state[2][10] * 10 + state[2][1];
            const ans = num1 + num2;

            // 上部の式更新
            document.getElementById('num1-text').textContent = num1;
            document.getElementById('num2-text').textContent = num2;
            document.getElementById('ans-text').textContent = ans;

            // こたえのお皿の数字バッジ更新
            document.getElementById('plate-ans-count').textContent = ans;

            // こたえのお皿のりんご描画（1000, 100, 10, 1の位に分解）
            const ansContainer = document.getElementById('plate-ans-apples');
            ansContainer.innerHTML = '';

            const c1000 = Math.floor(ans / 1000);
            const c100 = Math.floor((ans % 1000) / 100);
            const c10 = Math.floor((ans % 100) / 10);
            const c1 = ans % 10;

            const totalAnsApples = c1000 + c100 + c10 + c1;
            // こたえのお皿は3行分あるので、13個以上でコンパクト化、22個以上で超コンパクト化
            const sizeMode = totalAnsApples >= 22 ? 'super' : (totalAnsApples >= 13 ? 'compact' : 'normal');

            for (let i = 0; i < c1000; i++) ansContainer.appendChild(createAppleElement(1000, sizeMode));
            for (let i = 0; i < c100; i++) ansContainer.appendChild(createAppleElement(100, sizeMode));
            for (let i = 0; i < c10; i++) ansContainer.appendChild(createAppleElement(10, sizeMode));
            for (let i = 0; i < c1; i++) ansContainer.appendChild(createAppleElement(1, sizeMode));
        }

        // ぜんぶクリア
        function resetAll() {
            state[1] = { 100: 0, 10: 0, 1: 0 };
            state[2] = { 100: 0, 10: 0, 1: 0 };
            renderPlate(1);
            renderPlate(2);
            updateMath();
            playPopSound(0.5);
        }

        // 音声リストの事前読み込み（ローカル・高品質音声を優先）
        let jpVoice = null;
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return;

            // 音割れしやすいネットワーク音声よりも端末標準（localService）の自然な日本語音声を優先
            jpVoice = voices.find(v => v.lang.includes('ja') && v.localService && (v.name.includes('Kyoko') || v.name.includes('Otoya') || v.name.includes('Haruka') || v.name.includes('Ichiro') || v.name.includes('Ayumi')))
                   || voices.find(v => v.lang.includes('ja') && v.localService)
                   || voices.find(v => v.lang.includes('ja'));
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        // 音声読み上げ機能（オーディオ競合とデジタル音割れを完全に防止）
        async function speakEquation() {
            if (!('speechSynthesis' in window)) {
                return;
            }

            // 1. Web Audio API の出力を一時停止してオーディオチャンネルの干渉（ビリビリ音）を止める
            if (audioCtx && audioCtx.state === 'running') {
                try {
                    await audioCtx.suspend();
                } catch (e) {}
            }

            // 2. 現在の発話を完全にリセット
            window.speechSynthesis.cancel();

            const num1 = state[1][100] * 100 + state[1][10] * 10 + state[1][1];
            const num2 = state[2][100] * 100 + state[2][10] * 10 + state[2][1];
            const ans = num1 + num2;

            // 読み間違いや不自然なイントネーションを防ぐ自然なフレーズ
            const text = `${num1} たす ${num2} は、 ${ans}`;

            // 3. オーディオセッションの切り替え完了を待ってから再生（120ms）
            setTimeout(() => {
                if (!jpVoice) loadVoices();

                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'ja-JP';
                if (jpVoice) {
                    uttr.voice = jpVoice;
                }
                // 音声合成エンジンのリサンプリング歪み（ビリビリ音）を防ぐため等倍速・等ピッチに設定
                uttr.rate = 1.0;
                uttr.pitch = 1.0;
                // 最大音量(1.0)でのクリッピング（音割れ）を防ぐため少し余裕を持たせる
                uttr.volume = 0.85;

                const btn = document.getElementById('speak-btn');
                btn.classList.add('scale-105', 'ring-4', 'ring-amber-300');
                
                const cleanup = () => {
                    btn.classList.remove('scale-105', 'ring-4', 'ring-amber-300');
                };

                uttr.onend = cleanup;
                uttr.onerror = cleanup;

                window.speechSynthesis.speak(uttr);
            }, 120);
        }

        // 初期化
        window.onload = function() {
            loadVoices();
            renderPlate(1);
            renderPlate(2);
            updateMath();
        };
    </script>
</body>
