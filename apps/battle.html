<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ヒーローと空飛ぶロボット</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #7ec0ee 0%, #b0e0e6 60%, #90ee90 60%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #tap-hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="tap-hint">がめんをタッチして火をだそう！</div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
window.onload = function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STATE = {
        WALKING: 1,
        STOPPED: 2,
        DEFEATED: 3,
        CARRYING: 4
    };
    let gameState = STATE.WALKING;

    let bgX = 0;
    const worldSpeed = 3;

    let hero = {
        x: 80,
        y: 0,
        width: 60,
        height: 90,
        animFrame: 0
    };

    let robot = null;
    let fires = [];
    let carrierData = null;

    let isTouching = false;
    let touchTarget = { x: 0, y: 0 };
    let fireInterval = 0;
    let jumpTimer = 0;

    const buildings = [];
    for (let i = 0; i < 15; i++) {
        buildings.push({
            x: i * 250,
            w: 160 + Math.random() * 60,
            h: 200 + Math.random() * 150,
            color: ['#ff9999', '#99ccff', '#ffff99', '#ffb3ff', '#99ffcc'][Math.floor(Math.random() * 5)]
        });
    }

    function spawnRobot() {
        const types = ['drop', 'fly', 'walk_in', 'teleport'];
        const chosenType = types[Math.floor(Math.random() * types.length)];
        
        const farTargetX = canvas.width - 150;

        robot = {
            x: canvas.width + 400,
            y: canvas.height * 0.6 - 150,
            width: 100,
            height: 140,
            defeated: false,
            type: chosenType,
            targetX: farTargetX,
            targetY: canvas.height * 0.6 - 140
        };

        if (chosenType === 'drop') {
            robot.x = farTargetX;
            robot.y = -200;
            robot.targetY = canvas.height * 0.6 - 140;
        } else if (chosenType === 'fly') {
            robot.x = -200;
            robot.y = canvas.height * 0.2;
            robot.targetX = farTargetX;
            robot.targetY = canvas.height * 0.6 - 140;
        } else {
            robot.x = canvas.width + 400;
            robot.targetX = farTargetX;
        }

        jumpTimer = 0;
        gameState = STATE.STOPPED;
    }

    function handleTouchStart(e) {
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        isTouching = true;
        touchTarget = { x: clientX, y: clientY };

        shootFire();
        fireInterval = 0;
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (e.touches) {
            touchTarget = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        isTouching = false;
    }

    window.addEventListener('mousedown', handleTouchStart);
    window.addEventListener('mousemove', handleTouchMove);
    window.addEventListener('mouseup', handleTouchEnd);
    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });
    window.addEventListener('touchend', handleTouchEnd, { passive: false });

    function shootFire() {
        for (let i = 0; i < 3; i++) {
            const angle = Math.atan2(
                touchTarget.y - hero.y,
                touchTarget.x - hero.x
            ) + (Math.random() - 0.5) * 0.3;

            fires.push({
                x: hero.x + 40,
                y: hero.y + 20,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                size: 15 + Math.random() * 10
            });
        }
    }

    function update() {
        if (gameState === STATE.WALKING) {
            bgX -= worldSpeed;
            hero.animFrame += 0.15;

            if (Math.abs(bgX) % 1000 < 3) {
                spawnRobot();
            }
        }

        hero.y = canvas.height * 0.6 - hero.height;

        if (gameState === STATE.STOPPED && robot && !robot.defeated) {
            robot.x += (robot.targetX - robot.x) * 0.1;
            robot.y += (robot.targetY - robot.y) * 0.1;

            // ジャンプの高低差をさらに大きく変更（約280ピクセルまで高く飛び跳ねる）
            jumpTimer += 0.06;
            let jumpOffset = Math.sin(jumpTimer * Math.PI) * 280;
            if (jumpOffset < 0) jumpOffset = 0;
            robot.targetY = (canvas.height * 0.6 - 140) - jumpOffset;
        }

        if (isTouching) {
            fireInterval++;
            if (fireInterval % 6 === 0) {
                shootFire();
            }
        }

        for (let i = fires.length - 1; i >= 0; i--) {
            let f = fires[i];
            f.x += f.vx;
            f.y += f.vy;

            if (robot && !robot.defeated) {
                if (f.x > robot.x && f.x < robot.x + robot.width &&
                    f.y > robot.y && f.y < robot.y + robot.height) {
                    robot.defeated = true;
                    fires.splice(i, 1);
                    triggerDefeat();
                    continue;
                }
            }

            if (f.x > canvas.width || f.y < 0 || f.y > canvas.height) {
                fires.splice(i, 1);
            }
        }

        if (gameState === STATE.CARRYING && carrierData && robot) {
            carrierData.progress += 0.015;
            robot.x += 3.5;
            robot.y = (canvas.height * 0.6 - 140) + Math.sin(carrierData.progress * Math.PI * 4) * 1.5;

            if (carrierData.progress >= 1.0) {
                gameState = STATE.WALKING;
                robot = null;
                carrierData = null;
            }
        }
    }

    function triggerDefeat() {
        gameState = STATE.DEFEATED;
        carrierData = { progress: 0 };

        setTimeout(() => {
            gameState = STATE.CARRYING;
        }, 800);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 空
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

        // 太陽
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(canvas.width - 100, 80, 50, 0, Math.PI * 2);
        ctx.fill();

        // 雲
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(150, 100, 30, 0, Math.PI * 2);
        ctx.arc(180, 90, 40, 0, Math.PI * 2);
        ctx.arc(210, 100, 30, 0, Math.PI * 2);
        ctx.fill();

        // ビル群
        buildings.forEach((b) => {
            let currentX = (b.x + bgX * 0.5) % (buildings.length * 250);
            if (currentX < -250) currentX += buildings.length * 250;

            ctx.fillStyle = b.color;
            ctx.fillRect(currentX, canvas.height * 0.6 - b.h, b.w, b.h);

            ctx.fillStyle = '#fff';
            for (let wx = currentX + 20; wx < currentX + b.w - 20; wx += 30) {
                for (let wy = canvas.height * 0.6 - b.h + 20; wy < canvas.height * 0.6 - 30; wy += 40) {
                    ctx.fillRect(wx, wy, 15, 25);
                }
            }
        });

        // 地面
        ctx.fillStyle = '#7cfc00';
        ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);

        ctx.fillStyle = '#555';
        ctx.fillRect(0, canvas.height * 0.75, canvas.width, canvas.height * 0.25);

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6;
        ctx.setLineDash([40, 30]);
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.875);
        ctx.lineTo(canvas.width, canvas.height * 0.875);
        ctx.stroke();
        ctx.setLineDash([]);

        // ヒーロー
        ctx.save();
        ctx.translate(hero.x + hero.width/2, hero.y + hero.height/2);
        let bounce = 0;
        if (gameState === STATE.WALKING) {
            bounce = Math.sin(hero.animFrame * 5) * 5;
        }
        ctx.translate(0, bounce);

        ctx.fillStyle = '#0055ff';
        ctx.fillRect(-20, -25, 40, 50);

        ctx.fillStyle = '#ffccaa';
        ctx.beginPath();
        ctx.arc(0, -45, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0033cc';
        ctx.beginPath();
        ctx.arc(0, -48, 18, Math.PI, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -40, 8, 0, Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#0022aa';
        let legOffset = gameState === STATE.WALKING ? Math.sin(hero.animFrame * 5) * 10 : 0;
        ctx.fillRect(-15, 25, 10, 20 + legOffset);
        ctx.fillRect(5, 25, 10, 20 - legOffset);

        ctx.restore();

        // ロボット
        if (robot) {
            ctx.save();
            ctx.translate(robot.x + robot.width/2, robot.y + robot.height/2);

            if (robot.defeated) {
                ctx.rotate(Math.PI / 2);
                ctx.translate(0, 20);

                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('バタン！', 0, -90);
            }

            // ロボット本体
            ctx.fillStyle = robot.defeated ? '#888' : '#e74c3c';
            ctx.fillRect(-50, -60, 100, 90);

            // 目
            ctx.fillStyle = robot.defeated ? '#333' : '#f1c40f';
            ctx.fillRect(-30, -35, 25, 15);
            ctx.fillRect(5, -35, 25, 15);

            // 頭部プロペラ
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(-10, -80, 20, 20);

            // 腕
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(-65, -30, 15, 40);
            ctx.fillRect(50, -30, 15, 40);

            // 足
            ctx.fillStyle = '#992d22';
            ctx.fillRect(-35, 30, 20, 30);
            ctx.fillRect(15, 30, 20, 30);

            ctx.restore();
        }

        // 火
        fires.forEach(f => {
            ctx.save();
            ctx.font = `${f.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔥', f.x, f.y);
            ctx.restore();
        });

        if (isTouching) {
            ctx.fillStyle = 'rgba(255, 165, 0, 0.4)';
            ctx.beginPath();
            ctx.arc(touchTarget.x, touchTarget.y, 40, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
};
</script>

</body>
</html>
