
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>シャボン玉と のりものランド</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Hiragino Sans', 'Meiryo', sans-serif;
            background-color: #87CEEB;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Top Navigation Buttons */
        .top-btn {
            position: absolute;
            top: 15px;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.1s ease;
        }
        .top-btn:active {
            transform: scale(0.9);
        }
        #bgBtn {
            left: 15px;
            border: 3px solid #4CAF50;
        }

        /* Quit Confirmation Popup Dialog */
        #confirmOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .dialog-card {
            background: #FFFFFF;
            padding: 24px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 320px;
            width: 85%;
            border: 4px solid #FFD54F;
        }
        .dialog-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .dialog-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .dialog-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .dialog-btn-stay {
            background: #4CAF50;
            color: white;
        }
        .dialog-btn-quit {
            background: #FF5252;
            color: white;
        }
    </style>
</head>
<body>

    <button id="bgBtn" class="top-btn" title="背景チェンジ">🎨</button>
    <canvas id="gameCanvas"></canvas>

    <!-- Modal Dialog for Exit Prevention -->
    <div id="confirmOverlay">
        <div class="dialog-card">
            <div class="dialog-title">ほんとうに<br>おわる？</div>
            <div class="dialog-buttons">
                <button id="stayBtn" class="dialog-btn dialog-btn-stay">つづける</button>
                <button id="quitBtn" class="dialog-btn dialog-btn-quit">おわる</button>
            </div>
        </div>
    </div>

<script>
/**
 * Bubble & Vehicle Land Game Engine
 * Optimized for toddlers (2-6 years old)
 */

window.onload = function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgBtn = document.getElementById('bgBtn');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const stayBtn = document.getElementById('stayBtn');
    const quitBtn = document.getElementById('quitBtn');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // --- OS Back Button & Exit Interception ---
    function setupHistoryTrap() {
        history.pushState({ page: 'game' }, '', window.location.href);
    }
    setupHistoryTrap();

    window.addEventListener('popstate', function (e) {
        setupHistoryTrap();
        showExitConfirm();
    });

    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = '';
    });

    function showExitConfirm() {
        confirmOverlay.style.display = 'flex';
    }

    function hideExitConfirm() {
        confirmOverlay.style.display = 'none';
    }

    stayBtn.addEventListener('click', () => {
        sound.playPopSound();
        hideExitConfirm();
    });

    quitBtn.addEventListener('click', () => {
        hideExitConfirm();
        window.history.back();
    });

    // --- Audio Synthesizer (Web Audio API) ---
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.bgmTimer = null;
            this.bgmNoteIndex = 0;
            this.bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.startBGM();
            } else if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.3) {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {}
        }

        playMergeSound() {
            if (!this.ctx) return;
            this.playTone(300, 'sine', 0.08, 0.4);
            setTimeout(() => this.playTone(600, 'sine', 0.12, 0.4), 40);
        }

        playPopSound() {
            if (!this.ctx) return;
            this.playTone(800, 'triangle', 0.05, 0.5);
            setTimeout(() => this.playTone(1200, 'sine', 0.1, 0.3), 30);
        }

        playMegaPopSound() {
            if (!this.ctx) return;
            const freqs = [400, 600, 800, 1000, 1200, 1600];
            freqs.forEach((f, i) => {
                setTimeout(() => this.playTone(f, 'triangle', 0.15, 0.4), i * 40);
            });
        }

        playLandSound() {
            if (!this.ctx) return;
            this.playTone(200, 'sine', 0.08, 0.2);
        }

        playVanishSound() {
            if (!this.ctx) return;
            this.playTone(1000, 'sine', 0.08, 0.3);
            setTimeout(() => this.playTone(1500, 'sine', 0.1, 0.3), 50);
        }

        startBGM() {
            if (this.bgmTimer) return;
            this.bgmTimer = setInterval(() => {
                if (this.ctx) {
                    const freq = this.bgmNotes[this.bgmNoteIndex];
                    this.playTone(freq, 'sine', 0.4, 0.04);
                    this.bgmNoteIndex = (this.bgmNoteIndex + 1) % this.bgmNotes.length;
                }
            }, 600);
        }
    }

    const sound = new SoundEngine();

    // --- Background Themes ---
    const BACKGROUND_TYPES = ['sky', 'park', 'flower', 'rainbow', 'night', 'snow'];
    let currentBgIndex = Math.floor(Math.random() * BACKGROUND_TYPES.length);

    function drawBackground() {
        const type = BACKGROUND_TYPES[currentBgIndex];

        if (type === 'sky') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#70C5FF');
            grad.addColorStop(1, '#B9E3FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#FFDD00';
            ctx.beginPath();
            ctx.arc(80, 80, 40, 0, Math.PI * 2);
            ctx.fill();

            drawCloud(width * 0.2, 100, 0.8);
            drawCloud(width * 0.7, 140, 1.2);
        } else if (type === 'park') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#A1E4FF');
            grad.addColorStop(0.7, '#D4F5FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#81C784';
            ctx.beginPath();
            ctx.arc(width * 0.3, height + 100, height * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#66BB6A';
            ctx.beginPath();
            ctx.arc(width * 0.8, height + 150, height * 0.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'flower') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#FFE0F0');
            grad.addColorStop(1, '#E8F5E9');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#A5D6A7';
            ctx.fillRect(0, height - 100, width, 100);

            for (let i = 50; i < width; i += 80) {
                drawSimpleFlower(i, height - 70);
            }
        } else if (type === 'rainbow') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#E0F7FA');
            grad.addColorStop(1, '#FFF9C4');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const colors = ['#FF8A80', '#FFD180', '#FFFF8D', '#A7FFEB', '#80D8FF', '#B388FF'];
            colors.forEach((c, idx) => {
                ctx.strokeStyle = c;
                ctx.lineWidth = 12;
                ctx.beginPath();
                ctx.arc(width / 2, height, Math.min(width, height) * 0.7 - idx * 12, Math.PI, 0);
                ctx.stroke();
            });
        } else if (type === 'night') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#1A237E');
            grad.addColorStop(1, '#3949AB');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#FFF59D';
            ctx.beginPath();
            ctx.arc(width - 80, 90, 35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            [0.1, 0.3, 0.5, 0.65, 0.85].forEach((pos, i) => {
                ctx.beginPath();
                ctx.arc(width * pos, 60 + (i % 3) * 40, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        } else if (type === 'snow') {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#B2EBF2');
            grad.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, height - 80, width, 80);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(0, height - 30, width, 30);
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.arc(25, -15, 25, 0, Math.PI * 2);
        ctx.arc(50, 0, 30, 0, Math.PI * 2);
        ctx.arc(25, 10, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawSimpleFlower(x, y) {
        ctx.fillStyle = '#FF80AB';
        for (let i = 0; i < 5; i++) {
            let angle = (i * Math.PI * 2) / 5;
            ctx.beginPath();
            ctx.arc(x + Math.cos(angle) * 10, y + Math.sin(angle) * 10, 8, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#FFEB3B';
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    // --- Bubble Class ---
    class Bubble {
        constructor(x, y, r) {
            this.x = x;
            this.y = y;
            this.r = r || Math.random() * 20 + 35;
            this.maxRadius = Math.min(width, height) * 0.42;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            this.isDragging = false;
            this.hue = Math.random() * 360;
        }

        update() {
            if (!this.isDragging) {
                this.x += this.vx + Math.sin(Date.now() * 0.001 + this.hue) * 0.3;
                this.y += this.vy + Math.cos(Date.now() * 0.0015 + this.hue) * 0.3;

                const speedFactor = Math.max(0.2, 1 - this.r / this.maxRadius);
                this.x += this.vx * speedFactor;
                this.y += this.vy * speedFactor;

                if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
                if (this.x + this.r > width) { this.x = width - this.r; this.vx *= -1; }
                if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
                if (this.y + this.r > height - 50) { this.y = height - 50 - this.r; this.vy *= -1; }
            }

            this.hue = (this.hue + 0.5) % 360;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            const isMax = this.r >= this.maxRadius * 0.95;

            let grad = ctx.createRadialGradient(-this.r * 0.3, -this.r * 0.3, this.r * 0.1, 0, 0, this.r);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            grad.addColorStop(0.6, `hsla(${this.hue}, 80%, 75%, 0.4)`);
            grad.addColorStop(0.9, `hsla(${(this.hue + 60) % 360}, 90%, 70%, 0.6)`);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.8)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = Math.max(2, this.r * 0.06);
            ctx.beginPath();
            ctx.arc(0, 0, this.r * 0.82, -Math.PI * 0.75, -Math.PI * 0.25);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(-this.r * 0.5, -this.r * 0.5, Math.max(3, this.r * 0.08), 0, Math.PI * 2);
            ctx.fill();

            if (isMax) {
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, 0.8)`;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(0, 0, this.r + 4 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // --- Emoji Vehicle List ---
    const VEHICLE_EMOJIS = [
        '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒', '🚐', '🛻', '🚚', '🚛',
        '🚜', '🚘', '🚗', '🚖', '🛵', '🏍️', '🛺', '🚲', '🛴',
        '✈️', '🚀', '🚁', '⛵', '🚢', '🚤', '🚆', '🚄', '🚅'
    ];

    class Vehicle {
        constructor(x, y, targetSize) {
            this.x = x;
            this.y = y;
            this.emoji = VEHICLE_EMOJIS[Math.floor(Math.random() * VEHICLE_EMOJIS.length)];
            
            this.size = targetSize;
            this.width = targetSize * 0.85;
            this.height = targetSize * 0.85;

            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -Math.random() * 3 - 2;
            this.gravity = 0.45;
            this.isGrounded = false;
            this.bounce = 0.2;
            this.vanishing = false;
            this.vanishScale = 1.0;
            this.opacity = 1.0;
            this.spawnTime = Date.now();
        }

        update(vehicles) {
            if (this.vanishing) {
                this.vanishScale += 0.08;
                this.opacity -= 0.12;
                return;
            }

            if (!this.isGrounded) {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.width / 2 < 0) { this.x = this.width / 2; this.vx *= -0.5; }
                if (this.x + this.width / 2 > width) { this.x = width - this.width / 2; this.vx *= -0.5; }

                const floorY = height - 20 - this.height / 2;
                let targetY = floorY;

                for (let other of vehicles) {
                    if (other !== this && other.isGrounded && !other.vanishing) {
                        let dx = Math.abs(this.x - other.x);
                        if (dx < (this.width + other.width) * 0.42) {
                            let topY = other.y - (other.height / 2) - (this.height / 2) + 2;
                            if (topY < targetY && this.y < other.y) {
                                targetY = topY;
                            }
                        }
                    }
                }

                if (this.y >= targetY) {
                    this.y = targetY;
                    if (Math.abs(this.vy) > 1.5) {
                        this.vy = -this.vy * this.bounce;
                        this.vx *= 0.5;
                        sound.playLandSound();
                    } else {
                        this.vy = 0;
                        this.vx = 0;
                        this.isGrounded = true;
                        sound.playLandSound();
                    }
                }
            } else {
                const floorY = height - 20 - this.height / 2;
                if (this.y < floorY) {
                    let supported = false;
                    for (let other of vehicles) {
                        if (other !== this && other.isGrounded && !other.vanishing) {
                            let dx = Math.abs(this.x - other.x);
                            if (dx < (this.width + other.width) * 0.42) {
                                let expectedTop = other.y - (other.height / 2) - (this.height / 2) + 2;
                                if (Math.abs(this.y - expectedTop) < 6 && this.y < other.y) {
                                    supported = true;
                                    break;
                                }
                            }
                        }
                    }
                    if (!supported) {
                        this.isGrounded = false;
                    }
                }

                this.x += (Math.random() - 0.5) * 0.15;
            }
        }

        draw() {
            if (this.opacity <= 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            let renderSize = this.size * (this.vanishing ? this.vanishScale : 1.0);
            ctx.globalAlpha = Math.max(0, this.opacity);

            ctx.font = `${Math.floor(renderSize)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Draw thick white stroke directly around emoji glyphs
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(4, renderSize * 0.12);
            ctx.lineJoin = 'round';
            ctx.strokeText(this.emoji, 0, 0);

            // Draw Emoji Foreground
            ctx.fillText(this.emoji, 0, 0);

            ctx.restore();
        }

        containsPoint(px, py) {
            if (this.vanishing || Date.now() - this.spawnTime < 300) return false;
            let halfW = (this.width / 2) * 1.1;
            let halfH = (this.height / 2) * 1.1;
            return px >= this.x - halfW && px <= this.x + halfW && py >= this.y - halfH && py <= this.y + halfH;
        }
    }

    // --- Particle System ---
    class Particle {
        constructor(x, y, color, speedScale = 1) {
            this.x = x;
            this.y = y;
            this.color = color;
            let angle = Math.random() * Math.PI * 2;
            let speed = (Math.random() * 6 + 2) * speedScale;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.size = Math.random() * 8 + 4;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.015;
            this.isStar = Math.random() > 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.1;
            this.alpha -= this.decay;
        }

        draw() {
            if (this.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.translate(this.x, this.y);

            if (this.isStar) {
                drawStar(0, 0, 5, this.size, this.size / 2);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
    }

    // --- Game Entities & Logic ---
    let bubbles = [];
    let vehicles = [];
    let particles = [];
    let activeDragBubble = null;

    function populateBubbles() {
        while (bubbles.length < 8) {
            let r = Math.random() * 20 + 35;
            let x = Math.random() * (width - r * 2) + r;
            let y = Math.random() * (height * 0.5) + r + 40;
            bubbles.push(new Bubble(x, y, r));
        }
    }

    populateBubbles();

    function spawnVehicleFromBubble(bubble) {
        const isMax = bubble.r >= bubble.maxRadius * 0.9;
        const randomSurprise = Math.random() < 0.10;
        const targetSize = bubble.r * 1.6;

        if (isMax || randomSurprise) {
            sound.playMegaPopSound();
            const count = 5 + Math.floor(Math.random() * 4);
            const multiSize = targetSize * 0.6;
            for (let i = 0; i < count; i++) {
                vehicles.push(new Vehicle(bubble.x + (Math.random() - 0.5) * 60, bubble.y, multiSize));
            }
            for (let i = 0; i < 45; i++) {
                let color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                particles.push(new Particle(bubble.x, bubble.y, color, 1.8));
            }
        } else {
            sound.playPopSound();
            vehicles.push(new Vehicle(bubble.x, bubble.y, targetSize));

            for (let i = 0; i < 15; i++) {
                let color = `hsl(${Math.random() * 360}, 90%, 70%)`;
                particles.push(new Particle(bubble.x, bubble.y, color, 1.0));
            }
        }
    }

    function createVanishEffect(x, y) {
        sound.playVanishSound();
        for (let i = 0; i < 18; i++) {
            let color = `hsl(${Math.random() * 360}, 100%, 75%)`;
            particles.push(new Particle(x, y, color, 1.2));
        }
    }

    function triggerOverheadFall(vanishedVehicle) {
        for (let v of vehicles) {
            if (v !== vanishedVehicle && v.isGrounded) {
                if (v.y < vanishedVehicle.y && Math.abs(v.x - vanishedVehicle.x) < (v.width + vanishedVehicle.width) * 0.5) {
                    v.isGrounded = false;
                }
            }
        }
    }

    // --- Interaction Management ---
    function getEventPos(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function handlePointerDown(e) {
        if (confirmOverlay.style.display === 'flex') return;

        sound.init();
        const pos = getEventPos(e);

        for (let i = bubbles.length - 1; i >= 0; i--) {
            let b = bubbles[i];
            let dist = Math.hypot(pos.x - b.x, pos.y - b.y);
            if (dist <= b.r + 12) {
                activeDragBubble = b;
                b.isDragging = true;
                b.dragStartX = pos.x;
                b.dragStartY = pos.y;
                b.hasMoved = false;
                return;
            }
        }

        for (let i = vehicles.length - 1; i >= 0; i--) {
            let v = vehicles[i];
            if (v.containsPoint(pos.x, pos.y)) {
                v.vanishing = true;
                createVanishEffect(v.x, v.y);
                triggerOverheadFall(v);
                return;
            }
        }
    }

    function handlePointerMove(e) {
        if (!activeDragBubble) return;
        const pos = getEventPos(e);

        let distMoved = Math.hypot(pos.x - activeDragBubble.dragStartX, pos.y - activeDragBubble.dragStartY);
        if (distMoved > 8) {
            activeDragBubble.hasMoved = true;
        }

        activeDragBubble.x = pos.x;
        activeDragBubble.y = pos.y;

        for (let i = bubbles.length - 1; i >= 0; i--) {
            let other = bubbles[i];
            if (other !== activeDragBubble) {
                let d = Math.hypot(activeDragBubble.x - other.x, activeDragBubble.y - other.y);
                if (d < activeDragBubble.r + other.r * 0.6) {
                    sound.playMergeSound();

                    let areaA = Math.PI * activeDragBubble.r * activeDragBubble.r;
                    let areaB = Math.PI * other.r * other.r;
                    let newRadius = Math.sqrt((areaA + areaB) / Math.PI);

                    activeDragBubble.r = Math.min(activeDragBubble.maxRadius, newRadius);

                    for (let p = 0; p < 10; p++) {
                        particles.push(new Particle(activeDragBubble.x, activeDragBubble.y, '#FFFFFF', 0.8));
                    }

                    bubbles.splice(i, 1);
                    break;
                }
            }
        }
    }

    function handlePointerUp(e) {
        if (!activeDragBubble) return;

        if (!activeDragBubble.hasMoved) {
            spawnVehicleFromBubble(activeDragBubble);
            let idx = bubbles.indexOf(activeDragBubble);
            if (idx !== -1) bubbles.splice(idx, 1);
        }

        if (activeDragBubble) {
            activeDragBubble.isDragging = false;
            activeDragBubble = null;
        }
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    window.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp, { passive: false });

    bgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.init();
        currentBgIndex = (currentBgIndex + 1) % BACKGROUND_TYPES.length;
        sound.playPopSound();
    });

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // --- Main Game Loop ---
    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        if (bubbles.length < 6) {
            populateBubbles();
        }

        for (let i = bubbles.length - 1; i >= 0; i--) {
            let b = bubbles[i];
            b.update();
            b.draw();
        }

        for (let i = vehicles.length - 1; i >= 0; i--) {
            let v = vehicles[i];
            v.update(vehicles);
            v.draw();

            if (v.vanishing && v.opacity <= 0) {
                vehicles.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update();
            p.draw();
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    animate();
};
</script>
</body>
</html>
